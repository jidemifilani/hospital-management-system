name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────
  # 1. Lint & type-check (both apps in parallel)
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (all workspaces)
        run: npm run lint --workspaces --if-present

      - name: Type check (all workspaces)
        run: npm run typecheck --workspaces --if-present

  # ─────────────────────────────────────────────
  # 2. API tests (NestJS + Prisma)
  # ─────────────────────────────────────────────
  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hms_test
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://hms:secret@localhost:5432/hms_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-32chars-minimum-len
      JWT_REFRESH_SECRET: ci-test-refresh-secret-32chars-min
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace=apps/api

      - name: Run migrations
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Run API tests
        run: npm test --workspace=apps/api -- --passWithNoTests

  # ─────────────────────────────────────────────
  # 3. Web build (Next.js)
  # ─────────────────────────────────────────────
  build-web:
    name: Web Build
    runs-on: ubuntu-latest
    needs: lint

    env:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-nextauth-secret
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build --workspace=apps/web

  # ─────────────────────────────────────────────
  # 4. Docker build (smoke test)
  # ─────────────────────────────────────────────
  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    needs: [test-api, build-web]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: caresync-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: caresync-web:ci
          build-args: |
            DOCKER_BUILD=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
