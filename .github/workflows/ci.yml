name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 20 is the floor this repo declares. Building on the floor is what
  # catches code that quietly needs something newer.
  NODE_VERSION: "20"

jobs:
  # Fast feedback: nothing here needs a database, so it fails in a couple of
  # minutes rather than after the whole stack has booted.
  checks:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` runs each workspace package's prepare script, which is what
      # builds @hms/config, @hms/types and @hms/utils into dist.
      - run: npm ci

      # The Prisma client is generated code the types depend on; without it
      # every service that touches the database fails to compile.
      - run: npx prisma generate
        working-directory: apps/api

      - name: Typecheck API
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: apps/api

      - name: Typecheck web
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: apps/web

      - name: Lint
        run: npm run lint

      # These mock Prisma, so they need no services.
      - name: Unit tests
        run: npx jest --ci
        working-directory: apps/api

  # The browser suite, against production builds rather than dev servers: it
  # is what a deployment actually runs, and it proves the build works — which
  # nothing else in this repo does.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caresync
          POSTGRES_PASSWORD: caresync
          POSTGRES_DB: caresync
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caresync"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://caresync:caresync@localhost:5432/caresync
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-not-used-anywhere-real-0000000000000000
      NEXTAUTH_SECRET: ci-nextauth-secret-not-used-anywhere-real-000000000000
      # Throwaway, and the API will not boot without one. Never a real key:
      # this database is created and destroyed inside the job.
      FIELD_ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_PORT: "4000"
      # The suite signs in repeatedly as one seeded account; the shipped
      # default of 10 per 15 minutes would lock it out mid-run.
      LOGIN_RATE_LIMIT: "1000"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Generate client
        run: npx prisma generate
        working-directory: apps/api

      - name: Seed
        run: npx ts-node prisma/seed.ts
        working-directory: apps/api

      - name: Build API
        run: npx nest build
        working-directory: apps/api

      - name: Build web
        run: npx next build
        working-directory: apps/web

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start API
        working-directory: apps/api
        run: |
          node dist/main > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/api/v1/health > /dev/null; then
              echo "API up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API never became healthy:"; cat /tmp/api.log; exit 1

      - name: Start web
        working-directory: apps/web
        run: |
          npx next start --port 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/auth/login > /dev/null; then
              echo "Web up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Web never became healthy:"; cat /tmp/web.log; exit 1

      - name: End-to-end tests
        run: npx playwright test

      # The trace and screenshots are the whole reason a failure here is
      # diagnosable rather than a mystery.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Server logs on failure
        if: failure()
        run: |
          echo "── API ──"; tail -100 /tmp/api.log || true
          echo "── Web ──"; tail -100 /tmp/web.log || true

  # A backup nobody has restored is a file, not a backup. This takes a real one
  # and restores it into a second database on every push, so the day it is
  # needed is not the first time anyone has tried.
  backup-restore:
    name: Backup and restore
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caresync
          POSTGRES_PASSWORD: caresync
          POSTGRES_DB: caresync
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caresync"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://caresync:caresync@localhost:5432/caresync
      FIELD_ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      BACKUP_ENCRYPTION_KEY: ffeeddccbbaa99887766554433221100ffeeddccbbaa99887766554433221100
      BACKUP_DIR: /tmp/caresync-backups
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Generate client
        run: npx prisma generate
        working-directory: apps/api

      - name: Seed
        run: npx ts-node prisma/seed.ts
        working-directory: apps/api

      # The runner already has the postgres client tools, so PG_DOCKER_CONTAINER
      # stays unset here and pg_dump runs directly.
      - name: Take a backup
        run: npm run backup

      - name: Prove it is encrypted, and has a manifest
        run: |
          FILE=$(ls "$BACKUP_DIR"/*.dump.enc | head -1)
          head -c 8 "$FILE" | grep -q CSYNCBK1 || { echo "missing header"; exit 1; }
          if grep -qa PGDMP "$FILE"; then echo "dump is readable in the clear"; exit 1; fi
          MANIFEST="${FILE%.dump.enc}.manifest.enc"
          test -f "$MANIFEST" || { echo "no manifest beside the backup"; exit 1; }
          # The manifest says how many patients a hospital has; it is not plain JSON.
          if grep -qa '"patients"' "$MANIFEST"; then echo "manifest is not encrypted"; exit 1; fi
          echo "Encrypted, with manifest: $(basename "$FILE")"

      - name: Restore it and check the result
        run: npm run backup:verify

      # Restoring over a populated database without --force would be an easy
      # way to lose a hospital's records, so the refusal is part of the
      # contract and is checked here rather than trusted.
      - name: Refuses to overwrite a populated database
        run: |
          FILE=$(ls "$BACKUP_DIR"/*.dump.enc | head -1)
          if node scripts/restore.js "$FILE"; then
            echo "restore overwrote a populated database without --force"; exit 1
          fi
          echo "Refused, as it should."
